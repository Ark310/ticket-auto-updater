<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ticket Auto Updater</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      width: 460px;
      padding: 12px;
      box-sizing: border-box;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    select,
    button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    #currentTab {
      font-size: 12px;
      background: #eef5ff;
      border: 1px solid #c9ddff;
      padding: 8px;
      margin-bottom: 10px;
      word-break: break-word;
    }

    #status {
      margin-top: 10px;
      white-space: pre-wrap;
      font-size: 12px;
      background: #f5f5f5;
      padding: 8px;
      border: 1px solid #ddd;
      max-height: 200px;
      overflow: auto;
    }

    .small-note {
      font-size: 11px;
      color: #555;
      margin-top: 8px;
      line-height: 1.35;
    }
  </style>
</head>

<body>
  <h3>Ticket Auto Updater</h3>

  <div id="currentTab">Current tab: loading...</div>

  <label for="tabs">Choose ticket tab:</label>
  <select id="tabs"></select>

  <button id="reloadTabs">Reload tab list</button>
  <button id="fillOnly">Fill only, do not update</button>
  <button id="fillAndSubmit">Fill + press Update</button>

  <div class="small-note">
    Tip: Use “Fill only” first to confirm the correct dropdowns are being changed.
  </div>

  <div id="status">Ready.</div>

  <script src="popup.js"></script>
</body>
</html>
